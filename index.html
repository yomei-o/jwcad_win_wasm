  <input type="file" id="pickimg" aria-label="画像を挿入" accept=".bmp,.png,.jpg,.jpeg,image/bmp,image/png,image/jpeg" hidden>

  <span style="color:#777">ホイールで拡大縮小、右ドラッグで移動、Home で全体、Ctrl+Z 戻る・Ctrl+Y 進む・Ctrl+S 保存。タッチは 指一本で位置、二本で移動・拡大縮小（二本でちょんと触れると右ボタン）。</span>
</div>
<script>
// Language of the page chrome (not of the original's own strings): ?lang=en or ja, remembered; Japanese otherwise.
const LANG = (() => {
  try {
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'en' || q === 'ja') { localStorage.setItem('jw.lang', q); return q; }
    return localStorage.getItem('jw.lang') === 'en' ? 'en' : 'ja';
  } catch (e) { return 'ja'; }
})();
const EN = {
  'メモリが足りません': 'Out of memory',
  '実行ファイルを逆コンパイルして C に書き直した移植。': 'a port rewritten in C from the decompiled executable.',
  'ソース': 'Source',
  '.jww ・ .dxf ・ .sfc ・ .jwc ・ .jws ・座標ファイル を開く（画像は 画像編集 の 画像挿入 で）': 'Open .jww, .dxf, .sfc, .jwc, .jws or a coordinate file (pictures go in with 画像編集 > 画像挿入)',
  'DXF で保存': 'Save as DXF',
  'SFC で保存': 'Save as SFC',
  'JWC で保存': 'Save as JWC',
  'PDF で印刷': 'Print to PDF',
  'PNG で印刷': 'Print to PNG',
  '—— 図面はここで読むだけで、どこにも送られません。': '-- Drawings are read here only and are never sent anywhere.',
  'ホイールで拡大縮小、右ドラッグで移動、Home で全体、Ctrl+Z 戻る・Ctrl+Y 進む・Ctrl+S 保存。タッチは 指一本で位置、二本で移動・拡大縮小（二本でちょんと触れると右ボタン）。': 'Wheel zooms, right-drag pans, Home fits the sheet, Ctrl+Z undo, Ctrl+Y redo, Ctrl+S save. Touch: one finger points, two fingers pan and pinch (a two-finger tap is the right button).',
  '文字・数値の入力': 'Text and number input',
  '画像を挿入': 'Insert a picture',
  '最近のファイル': 'Recent files',
  'Jw_cad 図面。キーボード: 一文字コマンド、Enter、Esc、Ctrl+Z など': 'Jw_cad drawing. Keyboard: one-letter commands, Enter, Esc, Ctrl+Z and so on',
  ' に保存しました': ' saved',
  '図形の名前': 'Name of the figure',
  'この wasm には 文字の 範囲選択 の取り出しがありません': 'This wasm has no text range selection exports',
  '文字を置き換えました': 'Texts replaced',
  '行がありません': 'No lines',
  '文書込完了': 'Document written',
  '外部エディタ — 1 行が 1 文字です。空行は削除、行を足すと文字が増えます': 'External editor -- one line is one text. An empty line deletes it; extra lines make new texts',
  '取消': 'Cancel',
  'クリップボードを読めません': 'The clipboard cannot be read',
  '外部変形はブラウザ版では実行できません（BAT を走らせられないため）。デスクトップ版をお使いください': 'External transform (外部変形) cannot run in the browser because it has to run a batch file. Use the desktop version',
  '変更を保存していません。破棄して新規作成しますか？': 'There are unsaved changes. Discard them and start a new drawing?',
  ' — 基準点を指示してください': ' -- specify the base point',
  ' — 画像を覚えました（図面が名前で呼べます）': ' -- picture remembered (a drawing can call it by name)',
  ' — 置く点を指示してください': ' -- specify where to put it',
  ' 個の要素': ' elements',
  ' を開けません': ' cannot be opened',
  '保存されていない図面が残っています（': 'An unsaved drawing was left (',
  '）。': ').',
  '復元': 'Restore',
  '破棄': 'Discard',
  '保存されていない図面を復元しました': 'The unsaved drawing was restored',
};
const T = ja => (LANG === 'en' && EN[ja]) || ja;
// the text nodes and attributes the page starts with
if (LANG === 'en') {
  document.documentElement.lang = 'en';
  document.title = 'Jw_cad for Windows -- WASM port';
  const walk = el => {
    for (const n of el.childNodes) {
      if (n.nodeType === 3) {
        const whole = n.nodeValue.trim();
        const stripped = whole.replace(/^[—-]+\s*/, '');
        if (EN[whole]) n.nodeValue = n.nodeValue.replace(whole, EN[whole]);
        else if (stripped !== whole && EN[stripped]) n.nodeValue = n.nodeValue.replace(whole, '-- ' + EN[stripped]);
      } else if (n.nodeType === 1) {
        for (const a of ['aria-label', 'title'])
          if (n.hasAttribute(a) && EN[n.getAttribute(a)]) n.setAttribute(a, EN[n.getAttribute(a)]);
        walk(n);
      }
    }
  };
  document.addEventListener('DOMContentLoaded', () => walk(document.body));
}
</script>
<script src="jwcad.js?v=14"></script>
<script>
(async function () {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false });
  // While this is being worked on, ask for the wasm with a fresh query each
  // time: GitHub Pages caches it for ten minutes, and a stale one looks
  // exactly like a bug in the page.
  const mod = await createJwcad({
    locateFile: p => p + '?v=' + Date.now()
  });

  // A file is copied into the program's memory.  When there is no room malloc says 0, and
  // writing there would trample the program: so it is refused with a message instead.
  const alloc = n => {
    const p = mod._malloc(Math.max(1, n));
    if (!p) throw new Error(T('メモリが足りません'));
    return p;
  };
  const showErr = e => {
    document.getElementById('msg').textContent = String((e && e.message) || e);
  };
  const resize = mod.cwrap('jw_resize', 'number', ['number', 'number']);
  const width  = mod.cwrap('jw_width',  'number', []);
  const height = mod.cwrap('jw_height', 'number', []);
  const rgba   = mod.cwrap('jw_rgba',   'number', []);

  // The outline fonts (IPAexゴシック・IPAex明朝・BIZ UDゴシック) are not in
  // the wasm.  A text that names one makes the next paint ask for it
  // (jw_font_pending); it is fetched from fonts/ once, handed over, and the
  // drawing repainted.  Until it arrives, or if the fetch fails, the bitmap
  // font draws the text.
  const FONT_V = 1;
  const fontPending = mod.cwrap('jw_font_pending', 'number', []);
  const fontFile = mod.cwrap('jw_font_file', 'string', ['number']);
  const fontPut = mod.cwrap('jw_font_put', 'number', ['number', 'number', 'number']);
  const fontFail = mod.cwrap('jw_font_fail', null, ['number']);
  const repaint = mod.cwrap('jw_repaint', null, []);
  function pumpFonts() {
    for (let i = fontPending(); i >= 0; i = fontPending()) {
      const n = i;
      fetch('fonts/' + fontFile(n) + '?v=' + FONT_V)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(buf => {
          const bytes = new Uint8Array(buf);
          const p = alloc(bytes.length);
          mod.HEAPU8.set(bytes, p);
          const ok = fontPut(p, bytes.length, n);
          mod._free(p);
          if (ok) { repaint(); present(); } else fontFail(n);
        })
        .catch(() => fontFail(n));
    }
  }

  function present() {
    const w = width(), h = height();
    canvas.width = w;
    canvas.height = h;
    const p = rgba();
    // A view on the heap, not a copy: ALLOW_MEMORY_GROWTH can move the
    // buffer, so it has to be taken again after every call into wasm.
    const bytes = new Uint8ClampedArray(mod.HEAPU8.buffer, p, w * h * 4);
    ctx.putImageData(new ImageData(bytes, w, h), 0, 0);
    pumpFonts();
  }

  function fit() {
    const wrap = document.getElementById('wrap');
    // The frame is laid out for a desktop window: narrower than MINW its
    // status line and toolbars run into each other.  On a phone the picture
    // is made MINW wide and shown scaled down to the screen (touch points
    // are scaled back up by `k` in the handlers below).
    const MINW = 800;
    const cw = Math.max(1, wrap.clientWidth), chh = Math.max(1, wrap.clientHeight);
    const k = cw < MINW ? MINW / cw : 1;
    resize(Math.round(cw * k), Math.max(240, Math.round(chh * k)));
    canvas.style.width = k > 1 ? cw + 'px' : '';
    canvas.style.height = k > 1 ? chh + 'px' : '';
    present();
  }

  const zoomNow = mod.cwrap('jw_zoom',  null, ['number', 'number', 'number']);
  const panNow  = mod.cwrap('jw_pan',   null, ['number', 'number']);
  // Every pan or zoom repaints the whole drawing, and on a big one that takes
  // longer than the mouse takes to send the next event, so the picture would
  // trail behind the hand for seconds.  Gather what arrives and do it once a
  // frame instead: pans add up, zooms about the same point multiply.
  let queue = [], framed = false;
  const flush = () => {
    framed = false;
    const q = queue;
    queue = [];
    for (const o of q) {
      if (o.pan) panNow(o.dx, o.dy);
      else zoomNow(o.f, o.x, o.y);
    }
    if (q.length) present();
  };
  // anything that looks at the view has to see the pans and zooms before it
  const sync = () => { if (queue.length) flush(); };
  const press = (x, y, b) => { sync(); return pressNow(x, y, b); };
  const move = (x, y) => { sync(); return moveNow(x, y); };
  const command = id => { sync(); return commandNow(id); };
  const fitv = () => { sync(); fitvNow(); };
  const later = () => { if (!framed) { framed = true; requestAnimationFrame(flush); } };
  const pan = (dx, dy) => {
    const t = queue[queue.length - 1];
    if (t && t.pan) { t.dx += dx; t.dy += dy; }
    else queue.push({ pan: true, dx, dy });
    later();
  };
  const zoom = (f, x, y) => {
    const t = queue[queue.length - 1];
    if (t && !t.pan && t.x === x && t.y === y) t.f *= f;
    else queue.push({ f, x, y });
    later();
  };
  const fitvNow = mod.cwrap('jw_fit',   null, []);
  const open  = mod.cwrap('jw_open',  'number', ['number', 'number']);
  const openDxf = mod.cwrap('jw_open_dxf', 'number', ['number', 'number']);
  const openSfc = mod.cwrap('jw_open_sfc', 'number', ['number', 'number']);
  const openJwc = mod.cwrap('jw_open_jwc', 'number', ['number', 'number']);
  const figure = mod.cwrap('jw_figure', 'number', ['number', 'number']);
  const text   = mod.cwrap('jw_bunyomi', 'number', ['number', 'number']);
  const saveFig = mod.cwrap('jw_save_fig', 'number', []);
  // 画像編集: a picture file goes in by name and bytes; 画像分離 hands pictures out
  const imageIn = mod.cwrap('jw_image', 'number', ['number', 'number', 'number', 'number']);
  const imageStore = mod.cwrap('jw_image_store', 'number', ['number', 'number', 'number', 'number']);
  const imageOutCount = mod.cwrap('jw_image_out_count', 'number', []);
  const imageOutName = mod.cwrap('jw_image_out_name', 'number', ['number', 'number', 'number']);
  const imageOutPtr = mod.cwrap('jw_image_out_ptr', 'number', ['number']);
  const imageOutLen = mod.cwrap('jw_image_out_len', 'number', ['number']);
  const saveCoord = mod.cwrap('jw_save_coord', 'number', []);
  const coord = mod.cwrap('jw_coord', 'number', ['number', 'number']);
  const nobj  = mod.cwrap('jw_nobj',  'number', []);
  const error = mod.cwrap('jw_error', 'string', []);
  const pressNow = mod.cwrap('jw_press', 'number', ['number', 'number', 'number']);
  const commandNow = mod.cwrap('jw_command', 'number', ['number']);
  const modified = mod.cwrap('jw_modified', 'number', []);
  const newDrawing = mod.cwrap('jw_new', null, []);
  const newCount = mod.cwrap('jw_new_count', 'number', []);
  const key = mod.cwrap('jw_key', 'number', ['number']);
  const shiftEnter = mod.cwrap('jw_shift_enter', 'number', []);
  const textin = mod.cwrap('jw_text_in', 'number', ['number', 'number']);
  const cmdid = mod.cwrap('jw_cmd_id', 'number', []);
  const chromeh = mod.cwrap('jw_chrome_h', 'number', []);
  // The caption says what the original's does: the file's name and then
  // " - jw_win".  The name goes over as UTF-16, like typed text does.
  const setName = s => {
    const p = alloc(Math.max(2, s.length * 2));
    for (let i = 0; i < s.length; i++)
      mod.HEAPU16[(p >> 1) + i] = s.charCodeAt(i);
    mod.ccall('jw_name', null, ['number', 'number'], [p, s.length]);
    mod._free(p);
  };
  const boxfocus = mod.cwrap('jw_box_focus', 'number', []);
  const keyu = mod.cwrap('jw_key_u', 'number', ['number']);
  const compu = mod.cwrap('jw_compose_u', 'number', ['number']);
  const missing = ['_jw_key_u', '_jw_compose_u', '_jw_cmd_id']
                  .filter(f => typeof mod[f] !== 'function');

  // A canvas cannot host an IME, so a transparent input is kept over it and
  // focused: the candidate window then appears where the input is, and what
  // comes back is handed to the port as UTF-16 for it to turn into CP932.
  const ime = document.createElement('input');
  ime.setAttribute('aria-label', T('文字・数値の入力'));
  // Not hidden, just invisible: a one pixel transparent box is something
  // browsers will refuse to put an IME on, and without a real editable area
  // under the cursor a conversion has nowhere to happen.  This one sits
  // exactly over the edit of the box the port draws, with nothing of its own
  // showing through.
  ime.style.cssText = 'position:fixed;left:0;top:0;width:200px;height:20px;'
                    + 'background:transparent;border:0;outline:0;padding:0;'
                    + 'color:transparent;caret-color:transparent;'
                    + 'font:13px sans-serif;z-index:2;display:none;'
                    /* clicks have to reach the drawing underneath; being
                       focused is enough for an IME */
                    + 'pointer-events:none';
  document.body.appendChild(ime);
  // Anything that goes wrong in here would otherwise be invisible: the page
  // would simply stop taking what is typed.  Say so on the page instead.
  const oops = document.createElement('div');
  oops.style.cssText = 'position:fixed;left:0;bottom:0;right:0;z-index:3;'
                     + 'background:#fee;color:#900;font:12px monospace;'
                     + 'padding:2px 6px;display:none';
  document.body.appendChild(oops);
  // Which build is running, so a stale page can be told from a bug, and what
  // the text command is doing right now.  Only with ?debug on the address:
  // the point of this port is to look like the original, and a build number
  // in the corner is not part of that.
  const debug = new URLSearchParams(location.search).has('debug');
  const ver = document.createElement('div');
  ver.style.cssText = 'position:fixed;right:0;bottom:0;z-index:3;'
                    + 'background:#eef;color:#446;font:11px monospace;'
                    + 'padding:1px 5px';
  if (debug) document.body.appendChild(ver);
  if (debug) window.__jw = mod;       /* for the headless sweeps */
  const VERSION = 9;
  let lastnote = '';
  const note = t => {
    if (!debug || t === lastnote) return;
    lastnote = t;
    ver.textContent = 'build ' + VERSION + (t ? '  ' + t : '');
  };
  note('');
  const complain = e => {
    oops.textContent = String(e && (e.message || e));
    oops.style.display = 'block';
  };
  window.addEventListener('error', e => complain(e.error || e.message));
  const guard = f => (...a) => { try { return f(...a); } catch (e) { complain(e); } };
  let composing = false;
  // One UTF-16 unit at a time, converted to CP932 inside the port.  Nothing
  // is allocated here, so there is no heap view to get wrong.
  const send = s => {
    if (!s) return;
    for (let i = 0; i < s.length; i++) keyu(s.charCodeAt(i));
    present();
  };
  // In the 文字 command put the hidden input over the box the port draws,
  // so the candidate list comes up by the text being typed rather than
  // wherever the mouse last was.  81,39 is where the original's own box
  // sits in the frame, and 8,31 is its client corner.
  const aim = () => {
    const r = canvas.getBoundingClientRect();
    const s = r.width / canvas.width;
    if (cmdid() === 0x8026) {
      ime.style.left = (r.left + (81 + 8 + 6) * s) + 'px';
      ime.style.top = (r.top + (chromeh() + 39 + 31 + 4) * s) + 'px';
      ime.style.width = (438 * s) + 'px';
      ime.style.height = (20 * s) + 'px';
      ime.style.display = 'block';
    } else if (boxfocus()) {
      /* a number box on the command bar has the caret: a phone needs a real
         input under it to bring up its keyboard, the digit one */
      ime.style.left = (r.left + 4) + 'px';
      ime.style.top = (Math.min(r.bottom, innerHeight) - 24) + 'px';
      ime.style.width = '120px';
      ime.style.height = '20px';
      ime.style.display = 'block';
    } else {
      ime.style.display = 'none';   /* out of the way of the drawing */
    }
    ime.inputMode = cmdid() !== 0x8026 && boxfocus() ? "decimal" : "text";
    ime.focus({ preventScroll: true });
    note(cmdid() === 0x8026
         ? 'text box ready, focus=' + (document.activeElement === ime)
         : '');
  };
  // What the IME is still converting is shown in the box, underlined, until
  // it is confirmed -- otherwise typing looks like nothing is happening.
  if (missing.length)
    complain('this jwcad.js is out of date, it has no ' + missing.join(', '));
  const showComposing = s => {
    compu(-1);
    for (let i = 0; i < s.length; i++) compu(s.charCodeAt(i));
    present();
  };
  ime.addEventListener('compositionstart', guard(() => {
    composing = true;
    note('composing');
  }));
  ime.addEventListener('compositionupdate', guard(e => {
    note('composing ' + JSON.stringify(e.data || ''));
    showComposing(e.data || '');
  }));
  ime.addEventListener('compositionend', guard(e => {
    composing = false;
    const v = e.data || ime.value;   /* some IMEs leave data empty */
    ime.value = '';
    showComposing('');
    note('committed ' + JSON.stringify(v || ''));
    send(v);
  }));
  ime.addEventListener('input', guard(e => {
    if (composing) return;          // still being converted
    const v = ime.value;
    ime.value = '';
    send(v);
  }));
  ime.addEventListener('keydown', e => {
    if (composing) return;
    if (e.key === 'Backspace') { if (key(8)) present(); e.preventDefault(); }
  });
  // The hidden input is only needed for a kanji conversion, which has to go
  // through a real element.  Plain characters are taken off the window as
  // well, so typing works whether or not the focus ended up where it was
  // meant to -- clicking the canvas moves the focus back to the page, and
  // the 文字 command would otherwise take nothing.
  window.addEventListener('keydown', e => {
    /* While an IME is converting, the keys are its business.  The first key
       of a conversion is the awkward one: Chrome sends its keydown *before*
       compositionstart, with isComposing still false, so neither of the two
       flags below is set yet -- typing い came out as いi.  What marks it is
       keyCode 229, the code Windows and every browser use for "the IME is
       handling this"; a real key never has it. */
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Process' || e.key === 'Unidentified') return;
    if (composing) return;
    /* The original's own keyboard shortcuts (its ACCELERATOR table, which the
       native build gets from Windows): Ctrl+Z 戻る, Ctrl+Y 進む, Ctrl+S 保存,
       Ctrl+O 開く, Ctrl+P 印刷, Ctrl+C/X/V, Del 消去.  Ctrl+N is the
       browser's own and cannot be taken.  Copy, cut and paste are left to
       the text box while one has the caret. */
    {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      const typing = cmdid() === 0x8026 || boxfocus();
      let id = 0;
      if ((e.ctrlKey || e.metaKey) && !e.altKey) {
        if (k === 'z') id = e.shiftKey ? 57644 : 57643;
        else if (k === 'y') id = 57644;
        else if (k === 's') id = 57603;
        else if (k === 'o') id = 57601;
        else if (k === 'p') id = 57607;
        else if (!typing && k === 'c') id = 57634;
        else if (!typing && k === 'x') id = 57635;
        else if (!typing && k === 'v') id = 57637;
        else if (k === 'Insert') id = 57634;               /* Ctrl+Insert: コピー */
      } else if (e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey && !typing
                 && k === 'Insert') {
        id = 57637;                                        /* Shift+Insert: 貼り付け */
      } else if (e.altKey && !e.ctrlKey && e.key === 'Backspace') id = 57643;
      else if (!e.ctrlKey && !e.altKey && !e.metaKey && !typing && k === 'Delete')
        id = e.shiftKey ? 57635 : 32794;
      if (id === 57637 && navigator.clipboard && navigator.clipboard.readText && mod._jw_clip_set) {
        /* a copy made in another window comes by way of the system clipboard */
        e.preventDefault();
        navigator.clipboard.readText().then(t => {
          if (t && t.startsWith('JWCLIP:')) {
            const bytes = Uint8Array.from(atob(t.slice(7)), c => c.charCodeAt(0));
            const p = alloc(bytes.length);
            mod.HEAPU8.set(bytes, p);
            mod._jw_clip_set(p, bytes.length);
            mod._free(p);
          }
        }).catch(() => {}).then(() => react(command(id)));
        return;
      }
      if (id) {
        const r = command(id);
        react(r);
        if ((id === 57634 || id === 57635) && r && mod._jw_clip_get && navigator.clipboard) {
          const p = mod._jw_clip_get();
          if (p) {
            const bytes = mod.HEAPU8.slice(p, p + savedLen());
            savedFree();
            let s = '';
            for (let i = 0; i < bytes.length; i += 4096)
              s += String.fromCharCode.apply(null, bytes.subarray(i, i + 4096));
            navigator.clipboard.writeText('JWCLIP:' + btoa(s)).catch(() => {});
          }
        }
        e.preventDefault();
        return;
      }
    }
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    /* Esc and Space belong to the command whatever is in force -- Esc lets
       go of the points taken so far and Space turns 水平・垂直 over, which
       is what the original does with them.  They were going nowhere: the
       line below only let a key through while the 文字 command was on or a
       number box had the caret. */
    if (e.key === 'Escape') { if (key(27)) present(); e.preventDefault(); return; }
    if (e.key === ' ' && cmdid() !== 0x8026 && !boxfocus()) {
      if (key(32)) present();
      e.preventDefault();
      return;
    }
    /* A letter on its own is a command of its own -- a に文字, b に矩形 and
       the rest of the nineteen the original answered to.  The port decides:
       while 文字 is on or a number box has the caret it is typing, and
       otherwise it is looked up in that table.  Before this, everything but
       Esc and Space was dropped here unless one of those two was true, so
       the letters never arrived. */
    /* Enter and Tab are what a dialog's OK and its next box answer to (and
       Enter leaves a number box on the command bar).  The port takes them
       whatever is up and ignores them when there is nothing to take them. */
    if (e.key === 'Enter' || e.key === 'Tab') {
      /* Shift+Enter is 複写・移動's 基点変更 (ShiftEnter-基点変更, the bar's
         own hint once a range is settled) instead of plain Enter's
         範囲確定 -- a DOM keydown carries shiftKey itself, unlike WM_CHAR,
         so there is no GetKeyState to read here. */
      const took = e.key === 'Enter' && e.shiftKey ? shiftEnter()
                 : key(e.key === 'Enter' ? 13 : 9);
      if (took) { present(); e.preventDefault(); }
      return;
    }
    if (cmdid() !== 0x8026 && !boxfocus()) {
      if (e.key.length === 1 && e.key.charCodeAt(0) >= 0x20
          && e.key.charCodeAt(0) < 0x80) {
        if (key(e.key.charCodeAt(0))) present();
        e.preventDefault();
        /* the letter may have been a (a, the 文字 command), and a conversion
           needs the input box focused before the first key of it */
        setTimeout(aim, 0);
      }
      return;
    }
    if (e.key === 'Backspace') {
      if (key(8)) present();
      e.preventDefault();
    } else if (e.key.length === 1 && e.key.charCodeAt(0) >= 0x20) {
      if (e.key.charCodeAt(0) < 0x80) {
        if (key(e.key.charCodeAt(0))) present();
      } else {
        send(e.key);            /* a single character from outside ASCII */
      }
      e.preventDefault();
    }
  });
  // and keep the input focused while the 文字 command is on, so the IME has
  // somewhere to put its candidates
  ime.addEventListener('blur', () => {
    if (cmdid() === 0x8026) setTimeout(aim, 0);
  });
  const moveNow = mod.cwrap('jw_move',  'number', ['number', 'number']);
  const save      = mod.cwrap('jw_save', 'number', []);
  const saveDxf   = mod.cwrap('jw_save_dxf', 'number', []);
  const saveSfc   = mod.cwrap('jw_save_sfc', 'number', ['string']);
  const saveEnv   = mod.cwrap('jw_save_env', 'number', ['string']);
  const openEnv   = mod.cwrap('jw_open_env', 'number', ['number', 'number']);
  const saveJwc   = mod.cwrap('jw_save_jwc', 'number', []);
  const savedLen  = mod.cwrap('jw_saved_len', 'number', []);
  const savedFree = mod.cwrap('jw_saved_free', null, []);
  const plot      = mod.cwrap('jw_plot', 'number', ['number', 'number']);

  // 上書 and 名前を付けて保存 both come out here: a browser cannot write
  // back to the file it was given, so it offers the result as a download.
  let openedName = 'drawing.jww';
  let seenNew = newCount();
  // 新規 starts a drawing with no name; the downloads should not go on
  // carrying the name of the one that was open before it.
  function curName() {
    if (newCount() !== seenNew) { seenNew = newCount(); openedName = 'drawing.jww'; handles.clear(); }
    return openedName;
  }
  // File System Access API (Chromium): a save goes to a file the person picks,
  // and a later save under the same name writes back to it.  Anywhere else,
  // or if it fails, the download below is the fallback.
  const handles = new Map();
  async function writeOut(bytes, name) {
    try {
      let h = handles.get(name);
      if (!h) h = await window.showSaveFilePicker({ suggestedName: name });
      const w = await h.createWritable();
      await w.write(bytes);
      await w.close();
      handles.set(h.name, h);
      recentAdd(h).then(recentShow);
      if (/\.jww$/i.test(h.name)) { openedName = h.name; setName(h.name); }
      document.getElementById('msg').textContent = h.name + T(' に保存しました');
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return true;     /* cancelled: say nothing */
      handles.delete(name);
      return false;
    }
  }
  function offer(p, name) {
    if (!p) return;
    const bytes = mod.HEAPU8.slice(p, p + savedLen());
    savedFree();
    if (window.showSaveFilePicker) {
      writeOut(bytes, name).then(ok => { if (!ok) saveLink(bytes, name); });
      return;
    }
    saveLink(bytes, name);
  }
  function saveLink(bytes, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes],
      { type: 'application/octet-stream' }));
    a.download = name;
    document.body.appendChild(a);     /* some browsers ignore a link that is not in the page */
    a.click();
    // Let go of it later: taking the URL back at once can cancel the download
    // before the browser has started reading it.
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 30000);
  }

  function download() { offer(save(), curName()); }

  // 図形登録: the press that gave the 基準点 hands back 4, and the figure
  // is written out as a .jws for the browser to put somewhere.
  function downloadFig() {
    const name = window.prompt(T('図形の名前'), '図形') || '図形';
    offer(saveFig(), name.replace(/\.[^.]*$/, '') + '.jws');
  }

  // 座標ファイル: what is picked, as the original's own text file.
  function downloadCoord() {
    offer(saveCoord(), curName().replace(/\.[^.]*$/, '') + '.txt');
  }

  // DXF形式で保存: the same drawing written the way the original's DXF
  // export writes it (src/dxf.c).
  function downloadDxf() {
    offer(saveDxf(), curName().replace(/\.[^.]*$/, '') + '.dxf');
  }

  // SFC形式で保存 (src/sfcwrite.c).  The name it is saved under is written
  // into the file's header, so it is settled here rather than afterwards.
  function downloadSfc() {
    const name = curName().replace(/\.[^.]*$/, '') + '.sfc';
    offer(saveSfc(name), name);
  }

  // JWC形式で保存 (src/jwcwrite.c)
  function downloadJwc() {
    offer(saveJwc(), curName().replace(/\.[^.]*$/, '') + '.jwc');
  }

  // 印刷: the original prints the sheet one to one, in black unless
  // カラー印刷 is ticked, and clips whatever runs off the printer's paper.
  // A browser has no printer, so what comes out is the two things a print
  // is for -- a PDF to send to one, and a PNG to look at.  The page is the
  // drawing's own 用紙, which is the one page that never clips.  See
  // src/plot.h for what the original was asked.
  function downloadPlot(asPng) {
    const ext = asPng ? '.png' : '.pdf';
    offer(plot(asPng ? 1 : 0, 0), curName().replace(/\.[^.]*$/, '') + ext);
  }

  // 文読 (1069) asks for a text file; the next one picked goes to jw_text
  let askedText = false;
  let askedEnv = false;

  // 文字の 範囲選択: 文書 (13) downloads the picked texts as a .txt, 外部エディタ
  // (14) lets the lines be edited in a box and puts them back, 貼付 (15) puts the
  // clipboard's lines onto them.  What the SJIS/UTF8 button says decides how the
  // .txt is coded; the lines come back by their BOM, or as CP932.
  function mojiAction(r) {
    const msg = document.getElementById('msg');
    if (!mod._jw_moji_doc) { msg.textContent = T('この wasm には 文字の 範囲選択 の取り出しがありません'); return; }
    const dec = bytes => {
      const u8 = bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf;
      return new TextDecoder(u8 ? 'utf-8' : 'shift_jis').decode(bytes);
    };
    const give = str => {
      const enc = new TextEncoder().encode(str.replace(/\r?\n/g, '\r\n'));
      const bytes = new Uint8Array(enc.length + 3);
      bytes.set([0xef, 0xbb, 0xbf]); bytes.set(enc, 3);
      const p = alloc(bytes.length);
      mod.HEAPU8.set(bytes, p);
      const ok = mod._jw_moji_apply(p, bytes.length);
      mod._free(p);
      present();
      msg.textContent = ok ? T('文字を置き換えました') : T('行がありません');
    };
    if (r === 13) {
      const p = mod._jw_moji_doc();
      if (!p) return;
      offer(p, curName().replace(/\.[^.]*$/, '') + '.txt');
      msg.textContent = T('文書込完了');
      present();
    } else if (r === 14) {
      const p = mod._jw_moji_edit_text();
      if (!p) return;
      const bytes = mod.HEAPU8.slice(p, p + mod._jw_saved_len());
      mod._jw_saved_free();
      const text = dec(bytes);
      const box = document.createElement('dialog');
      box.innerHTML = '<form method="dialog"><p>' + T('外部エディタ — 1 行が 1 文字です。空行は削除、行を足すと文字が増えます') + '</p>'
        + '<textarea rows="14" cols="60" style="font-family:monospace"></textarea>'
        + '<p><button value="ok">OK</button> <button value="cancel">' + T('取消') + '</button></p></form>';
      box.querySelector('textarea').value = text;
      document.body.appendChild(box);
      box.addEventListener('close', () => {
        if (box.returnValue === 'ok') give(box.querySelector('textarea').value);
        box.remove();
      });
      box.showModal();
    } else if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(give, () => { msg.textContent = T('クリップボードを読めません'); });
    } else {
      msg.textContent = T('クリップボードを読めません');
    }
  }

  // What a press or a command came back asking for (see finish() in
  // src/main_wasm.c): a file to open or write, or just a repaint.
  function react(r) {
    if (r === 2) pickFile();
    else if (r === 3) download();
    else if (r === 4) downloadFig();
    else if (r === 5) downloadCoord();
    else if (r === 8) {
      const n = curName().replace(/\.[^.]*$/, '') + '.jwf';
      offer(saveEnv(n), n);
    }
    else if (r === 9) {
      askedEnv = true;
      pickFile();
    }
    else if (r === 6) {
      askedText = true;
      pickFile();
    }
    else if (r === 10) document.getElementById('pickimg').click();
    else if (r === 11) downloadImages();
    else if (r === 13 || r === 14 || r === 15) mojiAction(r);
    else if (r === 12) {
      document.getElementById('msg').textContent =
        T('外部変形はブラウザ版では実行できません（BAT を走らせられないため）。デスクトップ版をお使いください');
      present();
    }
    else if (r === 7) {
      if (confirm(T('変更を保存していません。破棄して新規作成しますか？'))) {
        newDrawing();
        curName();
        setName('');
        present();
      }
    }
    else if (r) present();
  }

  // 同梱画像分離: the folder a browser cannot make is a run of downloads
  function downloadImages() {
    const n = imageOutCount();
    for (let i = 0; i < n; i++) {
      const nb = alloc(600);
      const len = imageOutName(i, nb, 300);
      let name = '';
      for (let k = 0; k < len; k++) name += String.fromCharCode(mod.HEAPU16[(nb >> 1) + k]);
      mod._free(nb);
      const bytes = mod.HEAPU8.slice(imageOutPtr(i), imageOutPtr(i) + imageOutLen(i));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([bytes], { type: 'image/bmp' }));
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 30000);
    }
  }

  // a picture file: its name and bytes to the port (as 画像挿入 -- or, when
  // no 画像挿入 is waiting, only kept so a drawing that names it finds it)
  async function loadImage(file, insert) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const p = alloc(bytes.length);
    mod.HEAPU8.set(bytes, p);
    const nb = alloc(Math.max(2, file.name.length * 2));
    for (let i = 0; i < file.name.length; i++)
      mod.HEAPU16[(nb >> 1) + i] = file.name.charCodeAt(i);
    const ok = (insert ? imageIn : imageStore)(nb, file.name.length, p, bytes.length);
    mod._free(nb);
    mod._free(p);
    document.getElementById('msg').textContent = insert
      ? `${file.name}${LANG === 'en' ? ' -- specify the base point' : ' — 基準点を指示してください'}`
      : `${file.name}${LANG === 'en' ? T(' — 画像を覚えました（図面が名前で呼べます）') : ' — 画像を覚えました（図面が名前で呼べます）'}`;
    present();
    return ok;
  }

  async function load(file) {
    if (/\.(bmp|png|jpe?g)$/i.test(file.name)) return loadImage(file, false);
    // a .jww replaces the drawing that is open; the other formats go into it
    // (or hang on the cursor), which is no reason to ask
    if (!askedText && /\.jww$/i.test(file.name) && modified()
        && !confirm(LANG === 'en' ? 'There are unsaved changes. Discard them and open "' + file.name + '"?' : '変更を保存していません。破棄して「' + file.name + '」を開きますか？'))
      return;
    const bytes = new Uint8Array(await file.arrayBuffer());
    const p = alloc(bytes.length);
    mod.HEAPU8.set(bytes, p);
    // A .dxf or .sfc is read into the drawing that is open rather than in
    // place of it, which is what the original does with those two.
    // A .jws is a 図形: it enters 図形読込 and hangs on the cursor until a
    // point is clicked, so it does not become the drawing that is open.
    // a .txt is a 座標ファイル, which the original also reads as a 図形 --
    // unless 文読 (the 文字 bar's 1069) asked for it, and then its lines
    // go down from the next click instead
    const wantText = askedText;
    askedText = false;
    const wantEnv = askedEnv || /\.jwf$/i.test(file.name);
    askedEnv = false;
    const fig = !wantEnv && (wantText || /\.(jws|txt)$/i.test(file.name));
    const ok = wantEnv                   ? openEnv(p, bytes.length)
             : wantText                  ? text(p, bytes.length)
             : /\.dxf$/i.test(file.name) ? openDxf(p, bytes.length)
             : /\.sfc$/i.test(file.name) ? openSfc(p, bytes.length)
             : /\.jwc$/i.test(file.name) ? openJwc(p, bytes.length)
             : /\.txt$/i.test(file.name) ? coord(p, bytes.length)
             : fig ? figure(p, bytes.length)
             : open(p, bytes.length);
    mod._free(p);
    if (ok && !fig && !wantEnv) {
      openedName = file.name;
      setName(file.name);
    }
    document.getElementById('msg').textContent =
      !ok ? `${file.name}: ${error()}`
      : fig ? `${file.name}${LANG === 'en' ? ' -- specify where to put it' : ' — 置く点を指示してください'}`
      : `${file.name}${LANG === 'en' ? ' -- ' + nobj() + ' elements' : ' — ' + nobj() + ' 個の要素'}`;
    present();
  }

  document.getElementById('dxf').addEventListener('click', () => downloadDxf());
  document.getElementById('sfc').addEventListener('click', () => downloadSfc());
  document.getElementById('jwc').addEventListener('click', () => downloadJwc());
  document.getElementById('pdf').addEventListener('click', () => downloadPlot(false));
  document.getElementById('png').addEventListener('click', () => downloadPlot(true));

  document.getElementById('pickimg').addEventListener('change', e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (f) loadImage(f, true);
  });
  // Recent files: the handles of what the File System Access API opened or
  // saved, kept in IndexedDB (a handle cannot go in localStorage).  Choosing
  // one asks for permission again if the browser wants it.
  const recentSel = document.getElementById('recent');
  const idb = () => new Promise((ok, no) => {
    const q = indexedDB.open('jw_recent', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('h', { keyPath: 'name' });
    q.onsuccess = () => ok(q.result);
    q.onerror = () => no(q.error);
  });
  async function recentAll() {
    try {
      const db = await idb();
      return await new Promise(ok => {
        const r = db.transaction('h').objectStore('h').getAll();
        r.onsuccess = () => ok(r.result.sort((a, b) => b.t - a.t).slice(0, 8));
        r.onerror = () => ok([]);
      });
    } catch (e) { return []; }
  }
  async function recentAdd(h) {
    try {
      const db = await idb();
      db.transaction('h', 'readwrite').objectStore('h').put({ name: h.name, h, t: Date.now() });
    } catch (e) { /* no IndexedDB, or a handle it cannot store */ }
  }
  async function recentShow() {
    const l = await recentAll();
    recentSel.textContent = '';
    recentSel.add(new Option(T('最近のファイル'), ''));
    l.forEach(e => recentSel.add(new Option(e.name, e.name)));
    recentSel.hidden = !l.length;
    recentSel.onchange = async () => {
      const e = l.find(x => x.name === recentSel.value);
      recentSel.value = '';
      if (!e) return;
      try {
        if (e.h.queryPermission && await e.h.queryPermission({ mode: 'readwrite' }) !== 'granted'
            && await e.h.requestPermission({ mode: 'readwrite' }) !== 'granted') return;
        const f = await e.h.getFile();
        if (/\.jww$/i.test(f.name)) handles.set(f.name, e.h);
        load(f).catch(showErr);
      } catch (err) {
        document.getElementById('msg').textContent = e.name + T(' を開けません');
      }
    };
  }
  if (window.indexedDB && window.showOpenFilePicker) recentShow();

  // File System Access API open: keeps the handle so a later 上書 writes back.
  async function pickFile() {
    if (!window.showOpenFilePicker) { document.getElementById('pick').click(); return; }
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'Jw_cad',
        accept: { 'application/octet-stream': ['.jww', '.dxf', '.sfc', '.jwc', '.jws', '.txt', '.jwf'] } }] });
      const f = await h.getFile();
      if (/\.jww$/i.test(f.name)) handles.set(f.name, h);
      recentAdd(h).then(recentShow);
      load(f).catch(showErr);
    } catch (e) {
      if (!e || e.name !== 'AbortError') document.getElementById('pick').click();
    }
  }
  document.getElementById('pick').addEventListener('click', e => {
    if (e.isTrusted && window.showOpenFilePicker) { e.preventDefault(); pickFile(); }
  });
  document.getElementById('pick').addEventListener('change', e => {
    const f = e.target.files[0];
    // Without this, choosing the same file again (to go back to what was
    // saved, say) raises no change event and nothing happens.
    e.target.value = '';
    if (f) load(f).catch(showErr);
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]).catch(showErr);
  });

  // Wheel zooms about the pointer, dragging moves the sheet, Home refits --
  // the original does it with both mouse buttons, which a browser cannot see
  // reliably, so this is the nearest thing.
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    // A wheel click is a step of 100 (or 3 lines); a trackpad sends dozens of
    // small ones, a pinch sends them with ctrlKey.  Scale by how far it
    // moved so a trackpad does not go 1.25x for every little event.
    const k = canvas.width / r.width;
    let dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
    if (e.ctrlKey) dy *= 4;
    dy = Math.max(-300, Math.min(300, dy));
    if (!dy) return;
    zoom(Math.pow(1.25, -dy / 100),
         Math.round((e.clientX - r.left) * k), Math.round((e.clientY - r.top) * k));
  }, { passive: false });

  // The left button belongs to the command in force -- a toolbar button
  // changes it, a click in the drawing area gives it a point.  Dragging with
  // the middle or right button moves the sheet; the original uses both
  // buttons at once for that, which a browser cannot see reliably.
  const at = e => {
    const r = canvas.getBoundingClientRect();
    const k = canvas.width / r.width;
    return [Math.round((e.clientX - r.left) * k), Math.round((e.clientY - r.top) * k)];
  };
  let drag = null;
  // A left click: keep the hidden input focused so typing goes to the 文字
  // command, and put it where the pointer is so the IME's candidates come up
  // there.
  const leftClick = (e, x, y) => {
    ime.style.left = e.clientX + 'px';
    ime.style.top = e.clientY + 'px';
    ime.focus({ preventScroll: true });
    react(press(x, y, 0));
    setTimeout(aim, 0);       /* after the browser has moved the focus */
  };
  // Fingers.  A touch screen has no hover and no second button, so one finger
  // moves the cursor and the click happens where it is lifted -- the
  // rubber band follows the finger and the point goes where it was aimed,
  // not where it first landed.  Two fingers move the sheet and pinch zooms;
  // two fingers tapped together are the right button.
  const touches = new Map();
  let gesture = null;
  const touchPair = () => {
    const [a, b] = [...touches.values()];
    return { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2,
             d: Math.hypot(a.x - b.x, a.y - b.y) || 1 };
  };
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') {
      const r = canvas.getBoundingClientRect();
      const k = canvas.width / r.width;
      touches.set(e.pointerId, { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k,
                                 cx: e.clientX, cy: e.clientY });
      canvas.setPointerCapture(e.pointerId);
      if (touches.size === 2) {
        gesture = Object.assign(touchPair(), { moved: false, t: Date.now() });
      } else if (touches.size === 1) {
        const [x, y] = at(e);
        if (move(x, y)) present();
      }
      return;
    }
    const [x, y] = at(e);
    if (e.button === 0) {
      leftClick(e, x, y);
      return;
    }
    drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY,
             right: e.button === 2, moved: false };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') {
      const t = touches.get(e.pointerId);
      if (!t) return;
      const r = canvas.getBoundingClientRect();
      const k = canvas.width / r.width;
      t.x = (e.clientX - r.left) * k; t.y = (e.clientY - r.top) * k;
      t.cx = e.clientX; t.cy = e.clientY;
      if (gesture && touches.size >= 2) {
        const g = touchPair();
        if (Math.abs(g.cx - gesture.cx) > 6 || Math.abs(g.cy - gesture.cy) > 6
            || Math.abs(g.d - gesture.d) > 10) gesture.moved = true;
        if (gesture.moved) {
          pan(Math.round(g.cx - gesture.cx), Math.round(g.cy - gesture.cy));
          if (Math.abs(g.d / gesture.d - 1) > 0.01)
            zoom(g.d / gesture.d, Math.round(g.cx), Math.round(g.cy));
          gesture.cx = g.cx; gesture.cy = g.cy; gesture.d = g.d;
        }
      } else if (!gesture) {
        const [x, y] = at(e);
        if (move(x, y)) present();
      }
      return;
    }
    if (!drag) {
      const [x, y] = at(e);
      if (move(x, y)) present();
      if (mod._jw_tip) {                /* the original's own words for the button under the pointer */
        const tp = mod._jw_tip(x, y);
        const tt = tp ? mod.UTF8ToString(tp) : '';
        if (canvas.title !== tt) canvas.title = tt;
      }
      return;
    }
    if (Math.abs(e.clientX - drag.x0) > 3 || Math.abs(e.clientY - drag.y0) > 3)
      drag.moved = true;
    { const k = canvas.width / canvas.getBoundingClientRect().width;
      pan(Math.round((e.clientX - drag.x) * k), Math.round((e.clientY - drag.y) * k)); }
    drag.x = e.clientX;
    drag.y = e.clientY;
  });
  // A right click that did not move is a point for the command in force --
  // the "(R)" the original's status line talks about.  A right drag moves
  // the sheet, as it did before.
  canvas.addEventListener('pointerup', e => {
    setTimeout(aim, 0);
    if (e.pointerType === 'touch') {
      const had = touches.size;
      const t = touches.get(e.pointerId);
      touches.delete(e.pointerId);
      if (!t) return;
      if (gesture) {
        if (touches.size === 0) {
          const g = gesture;
          gesture = null;
          if (!g.moved && Date.now() - g.t < 500) {
            const r = canvas.getBoundingClientRect();
            react(press(Math.round(g.cx), Math.round(g.cy), 1));
          }
        }
        return;
      }
      if (had === 1) {
        const [x, y] = at(e);
        leftClick(e, x, y);
      }
      return;
    }
    if (drag && drag.right && !drag.moved) {
      const [x, y] = at(e);
      react(press(x, y, 1));
    }
    drag = null;
  });
  canvas.addEventListener('pointercancel', e => {
    touches.delete(e.pointerId);
    if (!touches.size) gesture = null;
    drag = null;
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (e.key === 'Home') { fitv(); present(); }
  });

  // Closing the tab or reloading throws the drawing away -- nothing is kept
  // anywhere -- so let the browser ask first when there is something to lose.
  window.addEventListener('beforeunload', e => {
    if (!modified()) return;
    e.preventDefault();
    e.returnValue = '';
  });

  window.addEventListener('resize', fit);
  fit();

  // Settings kept in this browser: the 環境設定 (基本設定, 画面倍率 ... as a .jwf)
  // and the 文字 bar's SJIS/UTF8.  Read back at start, written when the page is
  // left or hidden.  Anything that fails (no storage, a wasm without the
  // exports) is skipped; the page works the same without it.
  try {
    const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 4096) s += String.fromCharCode.apply(null, u8.subarray(i, i + 4096)); return btoa(s); };
    const saved = localStorage.getItem('jw.env');
    if (saved) {
      const bytes = Uint8Array.from(atob(saved), c => c.charCodeAt(0));
      const p = alloc(bytes.length);
      mod.HEAPU8.set(bytes, p);
      openEnv(p, bytes.length);
      mod._free(p);
      present();
    }
    if (mod._jw_moji_sjis_put && localStorage.getItem('jw.sjis') !== null)
      mod._jw_moji_sjis_put(localStorage.getItem('jw.sjis') === '0' ? 0 : 1);
    const keep = () => {
      try {
        const p = saveEnv('jw.jwf');
        if (p) {
          localStorage.setItem('jw.env', b64(mod.HEAPU8.slice(p, p + savedLen())));
          savedFree();
        }
        if (mod._jw_moji_sjis_get)
          localStorage.setItem('jw.sjis', String(mod._jw_moji_sjis_get()));
      } catch (e) { /* storage full or blocked */ }
    };
    window.addEventListener('pagehide', keep);
    document.addEventListener('visibilitychange', () => { if (document.hidden) keep(); });
  } catch (e) { /* storage not available */ }

  // Autosave and recovery.  While the drawing is changed and not saved, a copy
  // goes into IndexedDB every half minute (and when the tab is hidden); a
  // saved or discarded drawing takes it out.  If one is found at the start
  // the tab died or was closed with work in it, and a bar offers it back.
  // `?autosave=N` sets the interval in seconds (the tests use 1).
  const autoSecs = +(new URLSearchParams(location.search).get('autosave')) || 30;
  const autoDB = () => new Promise((ok, no) => {
    const q = indexedDB.open('jw_autosave', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('d');
    q.onsuccess = () => ok(q.result);
    q.onerror = () => no(q.error);
  });
  const autoPut = async rec => {
    try {
      const db = await autoDB();
      await new Promise(ok => {
        const t = db.transaction('d', 'readwrite');
        if (rec) t.objectStore('d').put(rec, 'last'); else t.objectStore('d').delete('last');
        t.oncomplete = ok; t.onerror = ok; t.onabort = ok;
      });
      db.close();
    } catch (e) { /* no IndexedDB: no autosave */ }
  };
  const autoGet = async () => {
    try {
      const db = await autoDB();
      const rec = await new Promise(ok => {
        const r = db.transaction('d').objectStore('d').get('last');
        r.onsuccess = () => ok(r.result); r.onerror = () => ok(null);
      });
      db.close();
      return rec || null;
    } catch (e) { return null; }
  };
  let autoHad = false;
  const autoSave = () => {
    if (!mod._jw_save_backup || document.getElementById('recover')) return;   /* the old copy is still being decided on */
    if (!modified()) {
      if (autoHad) { autoHad = false; autoPut(null); }
      return;
    }
    const p = mod._jw_save_backup();
    if (!p) return;
    const bytes = mod.HEAPU8.slice(p, p + savedLen());
    savedFree();
    autoHad = true;
    autoPut({ bytes, name: openedName, t: Date.now() });
  };
  setInterval(autoSave, autoSecs * 1000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) autoSave(); });
  window.addEventListener('pagehide', autoSave);
  (async () => {
    const rec = await autoGet();
    if (!rec || !rec.bytes || !mod._jw_mark_modified) return;
    const bar = document.createElement('div');
    bar.id = 'recover';
    bar.setAttribute('role', 'alert');
    bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:5;background:#fd8;color:#000;padding:6px 10px;font:14px sans-serif';
    bar.append(T('保存されていない図面が残っています（') + (rec.name || 'drawing.jww') + (LANG === 'en' ? ', ' : '、')
               + new Date(rec.t).toLocaleString() + T('）。'));
    const yes = document.createElement('button'), no = document.createElement('button');
    yes.textContent = T('復元'); no.textContent = T('破棄');
    yes.style.margin = '0 6px'; no.style.margin = '0 6px';
    yes.onclick = () => {
      const p = alloc(rec.bytes.length || 1);
      mod.HEAPU8.set(rec.bytes, p);
      const ok = open(p, rec.bytes.length);
      mod._free(p);
      if (ok) {
        openedName = rec.name || 'drawing.jww';
        setName(openedName);
        mod._jw_mark_modified();
        autoHad = true;
        document.getElementById('msg').textContent = T('保存されていない図面を復元しました');
      }
      present();
      bar.remove();
    };
    no.onclick = () => { autoPut(null); bar.remove(); };
    bar.append(yes, no);
    document.body.appendChild(bar);
  })();

  // Works offline once it has been loaded, and can be installed (sw.js,
  // manifest.webmanifest).  Only over http(s): file: has no service workers.
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* private window, blocked: no harm */ });
  }
})();
</script>
</body>
</html>
