<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jw_cad for Windows — WASM 移植</title>
<style>
  html, body { margin: 0; height: 100%; background: #202020; color: #ddd;
               font: 13px/1.5 "Segoe UI", "Meiryo", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 6px 10px; background: #2b2b2b; border-bottom: 1px solid #000; }
  header a { color: #8cf; }
  #wrap { flex: 1; overflow: auto; }
  canvas { display: block; image-rendering: pixelated; }
  #note { padding: 4px 10px; color: #999; }
</style>
</head>
<body>
<header>
  <b>Jw_cad for Windows 10.03.6</b> — 実行ファイルを逆コンパイルして C に書き直した移植。
  <a href="https://github.com/yomei-o/jwcad_win_wasm">ソース</a>
</header>
<div id="wrap"><canvas id="screen" width="1264" height="741"></canvas></div>
<div id="note">
  <label><input type="file" id="pick" accept=".jww"> .jww を開く</label>
  <span id="msg">—— 図面はここで読むだけで、どこにも送られません。</span>
  <span style="color:#777">ホイールで拡大縮小、ドラッグで移動、Home で全体。</span>
</div>
<script src="jwcad.js"></script>
<script>
(async function () {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false });
  const mod = await createJwcad();

  const resize = mod.cwrap('jw_resize', 'number', ['number', 'number']);
  const width  = mod.cwrap('jw_width',  'number', []);
  const height = mod.cwrap('jw_height', 'number', []);
  const rgba   = mod.cwrap('jw_rgba',   'number', []);

  function present() {
    const w = width(), h = height();
    canvas.width = w;
    canvas.height = h;
    const p = rgba();
    // A view on the heap, not a copy: ALLOW_MEMORY_GROWTH can move the
    // buffer, so it has to be taken again after every call into wasm.
    const bytes = new Uint8ClampedArray(mod.HEAPU8.buffer, p, w * h * 4);
    ctx.putImageData(new ImageData(bytes, w, h), 0, 0);
  }

  function fit() {
    const wrap = document.getElementById('wrap');
    resize(Math.max(320, wrap.clientWidth), Math.max(240, wrap.clientHeight));
    present();
  }

  const zoom  = mod.cwrap('jw_zoom',  null, ['number', 'number', 'number']);
  const pan   = mod.cwrap('jw_pan',   null, ['number', 'number']);
  const fitv  = mod.cwrap('jw_fit',   null, []);
  const open  = mod.cwrap('jw_open',  'number', ['number', 'number']);
  const nobj  = mod.cwrap('jw_nobj',  'number', []);
  const error = mod.cwrap('jw_error', 'string', []);
  const press = mod.cwrap('jw_press', 'number', ['number', 'number', 'number']);
  const move  = mod.cwrap('jw_move',  'number', ['number', 'number']);

  async function load(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const p = mod._malloc(bytes.length);
    mod.HEAPU8.set(bytes, p);
    const ok = open(p, bytes.length);
    mod._free(p);
    document.getElementById('msg').textContent =
      ok ? `${file.name} — ${nobj()} 個の要素` : `${file.name}: ${error()}`;
    present();
  }

  document.getElementById('pick').addEventListener('change', e => {
    if (e.target.files[0]) load(e.target.files[0]);
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
  });

  // Wheel zooms about the pointer, dragging moves the sheet, Home refits --
  // the original does it with both mouse buttons, which a browser cannot see
  // reliably, so this is the nearest thing.
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    zoom(e.deltaY < 0 ? 1.25 : 1 / 1.25,
         Math.round(e.clientX - r.left), Math.round(e.clientY - r.top));
    present();
  }, { passive: false });

  // The left button belongs to the command in force -- a toolbar button
  // changes it, a click in the drawing area gives it a point.  Dragging with
  // the middle or right button moves the sheet; the original uses both
  // buttons at once for that, which a browser cannot see reliably.
  const at = e => {
    const r = canvas.getBoundingClientRect();
    return [Math.round(e.clientX - r.left), Math.round(e.clientY - r.top)];
  };
  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    const [x, y] = at(e);
    if (e.button === 0) {
      if (press(x, y, 0)) present();
      return;
    }
    drag = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) {
      const [x, y] = at(e);
      if (move(x, y)) present();
      return;
    }
    pan(e.clientX - drag.x, e.clientY - drag.y);
    drag = { x: e.clientX, y: e.clientY };
    present();
  });
  canvas.addEventListener('pointerup', e => { drag = null; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (e.key === 'Home') { fitv(); present(); }
  });

  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
